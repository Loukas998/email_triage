[project]
name = "email-triage"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Loukas998", email = "majdlouka4@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.24.0",
    "ollama>=0.6.2",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
]

[project.scripts]
email-triage = "email_triage:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[too.pytest.ini_options]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not eval'"
markers = ["eval: runs the golden set through the local model; slow, opt in with -m eval"]
