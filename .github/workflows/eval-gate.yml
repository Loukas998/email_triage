# The laptop measures, CI checks. No model runs here: GitHub's free runners have no GPU, and an
# 8B model on CPU would take about an hour and give different numbers from the laptop's anyway.
name: eval

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write # to post the report on PR

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run pytest

# Runs on every PR, not only ones touching prompts/: a required check that is skipped never
# reports, and GitHub then waits for it forever.

  gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the base branch's history, for the two git commands below
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked

      - name: Gate
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          # Measured against what the base branch ships today, not what this PR claims it ships.
          baseline=$(git show "$BASE:prompts/baseline.txt" 2>/dev/null || cat prompts/baseline.txt)
          # Every triage prompt this PR adds or edits, plus the baseline it proposes.
          candidates=$( { git diff --name-only --diff-filter=AM "$BASE"...HEAD -- 'prompts/v*.yaml' \
                          | xargs -r -n1 basename -s .yaml; cat prompts/baseline.txt; } | sort -u)
          echo "baseline: $baseline · candidates: $candidates"
          uv run python -m email_triage.gate "$baseline" $candidates --report report.md

      - name: Post the report on the PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          [ -f report.md ] || exit 0
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR" --body-file report.md --edit-last || gh pr comment "$PR" --body-file report.md